[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navtext"
version = "0.1.0"
description = "Pipeline sinh dataset text tiếng Việt cho ASR domain Navigation"
requires-python = ">=3.12"
readme = "CLAUDE.md"
# stdlib-first (xem CLAUDE.md#code-conventions) — chỉ thêm dependency khi thật
# sự cần (đọc .pbf OSM, near-dup hashing). pyyaml: data/raw/admin/*.yaml,
# config/*.yaml đều là YAML — phase 2.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
navtext = "navtext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"navtext.web" = ["static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
