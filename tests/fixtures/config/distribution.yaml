# Fixture tí hon cho test_sampling.py — khớp với tests/fixtures/raw/ (2
# tỉnh: "01" có street + public_facility + admin_unit, "02" chỉ có
# admin_unit). Trần/sàn ở đây KHÔNG phải giá trị thật của
# config/distribution.yaml — chỉ đủ khả thi cho 2 tỉnh / 4 category dùng để
# test thuật toán độc lập với domain thật.

target_size: 1000
oversample_factor: 1.3
min_cell_size: 1
min_templates_per_cell: 10

province_weights:
  by_tier:
    1: 3.0
    2: 1.0
  municipality_bonus: 1.5

entity_weights:
  by_tier:
    1: 3.0
    2: 2.0
    3: 1.0

category_weights:
  admin_unit: 0.25
  street: 0.25
  address: 0.25
  public_facility: 0.25

admin_unit_subcategory_weights:
  province: 0.30
  district: 0.05
  ward: 0.65

sentence_type_weights:
  nav_command: 0.22
  search: 0.20
  route_question: 0.16
  conversational: 0.16
  short_command: 0.14
  contextual: 0.12

variation_profiles:
  - name: formal_medium
    register: formal
    length_class: medium
    weight: 0.15
  - name: neutral_short
    register: neutral
    length_class: short
    weight: 0.25
  - name: neutral_medium
    register: neutral
    length_class: medium
    weight: 0.25
  - name: casual_short
    register: casual
    length_class: short
    weight: 0.20
  - name: casual_long
    register: casual
    length_class: long
    weight: 0.15

caps:
  province:
    max_share: 0.9
    min_share: 0.1
  category:
    max_share: 0.5
    min_share: 0.05
  sentence_type:
    max_share: 0.35
    min_share: 0.08
  template:
    max_share: 0.015
  entity:
    max_share: 0.3
