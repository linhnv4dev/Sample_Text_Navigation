# Template bank — data/templates/templates.yaml
# SINH TỰ ĐỘNG bởi scripts/build_templates.py (bảng text trong script là
# nguồn viết tay duy nhất). Sửa text ở script rồi chạy lại, đừng sửa tay
# file này.
#
# Xem docs/generation.md#template-bank cho schema entry và quy tắc cứng.
#
# ===== NGỮ CẢNH: USER -> VOICE AGENT ======================================
# Mọi câu ở đây là câu người dùng NÓI VÀO MICRO cho trợ lý điều hướng. Test
# số 1 khi thêm template: "có tưởng tượng được ai đó nói câu này vào micro
# không?" Nếu nghe như văn viết, như nói với nhân viên, hoặc như hội thoại
# giữa hai người -> loại.
#
# REGISTER KHÔNG PHẢI MỨC ĐỘ LỊCH SỰ. Cả 3 đều là user -> agent:
#   formal  = câu đầy đủ, rõ ràng, ít khẩu ngữ ("chỉ đường giúp tôi đến X")
#   neutral = cách nói mặc định, bỏ bớt chủ ngữ, câu lệnh trần
#             ("chỉ đường đến X") — đây là style TRUNG TÂM của bank
#   casual  = khẩu ngữ hơn, cụt hơn, dùng "mình" + tiểu từ ("đưa mình tới X")
#
# Ràng buộc đã áp cho toàn bank:
# - KHÔNG kính ngữ liên nhân: "xin", "vui lòng", "thưa", "kính", "mong
#   được", "xin phép", "xin cảm ơn" — không ai nói vậy với máy.
# - KHÔNG hô gọi trợ lý ("trợ lý ơi", "ê trợ lý"): người dùng bấm nút mic
#   rồi nói thẳng nội dung.
# - KHÔNG gọi người thứ ba ("có ai biết ... không", "hỏi thăm") và không
#   dựng hội thoại giả giữa hai người.
# - KHÔNG slang vùng miền mạnh ("hông", "vô", "lẹ", "giùm", "coi", "ngó",
#   "tấp", "quẹo", "cua", "lượn", "phóng", "nè", "á"). Casual = SPOKEN,
#   không phải cố tình slang; phải nghe được ở cả ba miền.
# - Câu điều khiển thiết bị có thật (mở/bật chỉ đường, đặt/đổi điểm đến,
#   thêm điểm dừng, định vị, mở bản đồ) được rải đều 3 register.
#
# Quy ước kỹ thuật:
# - template_id = "<sentence_type>_<variation_profile>_<nnn>" (profile đã
#   gộp sẵn register+length_class, xem config/distribution.yaml). Đánh số
#   riêng trong từng ô — thêm template mới vào một ô không dịch id ô khác.
# - {opener}/{closer} không có khoảng trắng liền kề trong text: composer ở
#   phase 6 tự chèn space khi giá trị filled không rỗng, và chuẩn hoá
#   " ".join(text.split()) — nhờ vậy opener/closer rỗng không để lại
#   double space. {entity} luôn có mặt và dùng space literal quanh nó vì
#   entity không bao giờ rỗng.
# - Toàn bộ text viết thường (spoken-form transcript, không dấu câu cuối
#   câu) — tránh rủi ro "tên riêng viết hoa giữa câu" (hard rule #6).
# - 6 sentence_type × 5 variation_profile = 30 ô, mỗi ô đúng 10 template.


