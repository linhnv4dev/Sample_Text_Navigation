# Lexicon — từ vựng filler/particle/tiền tố hành chính cho variation.
# Xem docs/generation.md#lexicon--chống-câu-văn-viết-cứng.
#
# Đây là NGUỒN TỪ VỰNG, không phải trọng số. Trọng số các trục variation
# sống ở config/variation.yaml (phase 5) — hard rule #8.
#
# Chuỗi rỗng "" có mặt trong mọi list opener/closer vì "không dùng filler"
# cũng là một giá trị variation hợp lệ, không phải trường hợp đặc biệt
# phải xử lý riêng trong code. LƯU Ý (phase 5): xác suất rơi vào rỗng
# KHÔNG đến từ việc "" nằm trong list này — nó đến từ lexicon_rates trong
# config/variation.yaml (một nguồn sự thật duy nhất, hard rule #8). Phase 6
# (apply_variations()) trước tiên rút present/absent theo lexicon_rates;
# nếu "present", chỉ chọn đều trong các giá trị KHÁC RỖNG của list dưới
# đây. "" vẫn là dữ liệu hợp lệ ở đây (để rõ ràng là một lựa chọn có thật),
# nhưng generator không chọn ngẫu nhiên trực tiếp trên list còn "" trong
# đó — nếu làm vậy, xác suất "rỗng" sẽ bị tính hai lần.
#
# Quy ước: mọi giá trị ở đây là từ TRẦN (không kèm khoảng trắng). Composer
# ở phase 6 chịu trách nhiệm chèn space và chuẩn hoá " ".join(text.split()).

# Mỗi opener kèm `heads`: HeadClass nào được phép dùng nó (xem
# templates.HeadClass + _classify_head) — cùng cơ chế với `fillers` bên
# dưới. Hai loại:
# - Opener KHUNG HỎI ("xin phép hỏi", "cho tôi hỏi", "cho hỏi cái"...) chỉ
#   hợp lý trước một mệnh đề TRẦN THUẬT/NGHI VẤN (heads: [statement,
#   question]) — đứng trước một câu CẦU KHIẾN thì tạo ra hai khung câu
#   chồng nhau ("xin phép hỏi" + "xin chỉ đường đến..." = "xin phép hỏi xin
#   chỉ đường đến ..." — 2 lần "xin", sai — bug thật user báo cáo).
# - Opener HÔ GỌI trung tính ("này", "ê", "à", "ơ") không mang khung câu
#   riêng, dùng được trước mọi thức câu (heads: đủ 3 giá trị).
# `""` (không dùng opener) không cần khai heads — bị lọc khỏi pool ngay lúc
# load (chỉ giữ giá trị khác rỗng, xem load_lexicon()), xác suất rỗng đến
# từ lexicon_rates như comment đầu file đã giải thích.
openers:
  formal:
    - {text: "xin cho hỏi", heads: [statement, question]}
    - {text: "làm ơn cho hỏi", heads: [statement, question]}
    - {text: "xin phép hỏi", heads: [statement, question]}
    - {text: "cho tôi hỏi một chút", heads: [statement, question]}
  neutral:
    - {text: "cho hỏi", heads: [statement, question]}
    - {text: "cho tôi hỏi", heads: [statement, question]}
    - {text: "này", heads: [imperative, statement, question]}
    - {text: "cho mình hỏi", heads: [statement, question]}
  casual:
    - {text: "ê", heads: [imperative, statement, question]}
    - {text: "này", heads: [imperative, statement, question]}
    - {text: "cho hỏi cái", heads: [statement, question]}
    - {text: "ơ", heads: [imperative, statement, question]}
    - {text: "à", heads: [imperative, statement, question]}

closers:
  formal:
    - ""
    - "được không ạ"
    - "giúp tôi với ạ"
    - "xin cảm ơn"
    - "ạ"
  neutral:
    - ""
    - "nhé"
    - "giúp tôi"
    - "được không"
    - "với"
  casual:
    - ""
    - "với"
    - "đi"
    - "cái nhé"
    - "được không"
    - "giúp mình"
    - "nha"
    - "đi mà"

# Token đứng NGAY TRƯỚC {closer} quyết định câu đã "chốt" theo kiểu nào —
# templates.py#TailClass suy diễn tự động từ templates.yaml, KHÔNG khai báo
# tay. Hai pool dưới đây THAY THẾ (không cộng thêm) pool `closers` ở trên
# khi tail_class khác PLAIN, để tránh chồng tiểu từ cuối câu (hard rule #9,
# vd "…ở đâu không được không", "…không nha").
closers_after_particle:  # template đã kết ở "…không{closer}", "…nha{closer}"...
  formal:
    - ""
    - "ạ"
  neutral:
    - ""
  casual:
    - ""

closers_after_question:  # template đã kết ở "…ở đâu{closer}", "…đường nào{closer}"...
  formal:
    - ""
    - "ạ"
  neutral:
    - ""
    - "nhỉ"
    - "vậy"
  casual:
    - ""
    - "nhỉ"
    - "vậy"
    - "thế"

# Dùng bởi templates.py#_classify_tail để phân loại tail_class — không phải
# danh sách đầy đủ mọi tiểu từ tiếng Việt, chỉ những từ THỰC SỰ xuất hiện
# ngay trước {closer} trong templates.yaml hiện tại (rà bằng tay từng
# template một, xem docs/generation.md#template-bank). Cố tình bỏ ngoài
# những từ tuy đứng cuối câu nhưng vẫn là TỪ NỘI DUNG, không phải tiểu từ
# chốt câu — vd "rồi" (gấp lắm rồi), "đó"/"đây" (ghé vô đó/tới đây, nghĩa
# "ở đó/ở đây"), "thôi" (giới hạn phạm vi, không chặn closer), "tí"/"lắm"/
# "nhất" (mức độ) — closer vẫn gắn tự nhiên phía sau các từ này.
question_words: [đâu, nào, gì]
sentence_final_particles:
  [không, hông, hả, chưa, nhỉ, nhé, nha, sao, vậy, ta, nè, cái, đi, với]

# Dùng bởi templates.py#_classify_head để phân loại HeadClass (thức của
# câu: mệnh lệnh/trần thuật/nghi vấn) từ token nội dung ĐẦU TIÊN của
# template.text (bỏ {opener} nếu có) — cùng cơ chế TailClass ở trên nhưng
# soi đầu câu thay vì cuối câu. Chỉ liệt kê từ THỰC SỰ đứng đầu một template
# trong templates.yaml hiện tại (rà tay từng template, xem
# docs/generation.md#template-bank).
#
# head_statement_markers cố tình NGẮN: chỉ 3 từ chắc chắn mở đầu một mệnh
# đề TRẦN THUẬT có chủ ngữ ("mình"/"tôi" + động từ, "muốn" + động từ) — nơi
# filler mang nghĩa như "tự dưng" đứng tự nhiên ("tự dưng muốn qua Hoàn
# Kiếm mà không biết lối"). Mọi từ KHÔNG khớp cả 2 danh sách rơi về mặc
# định IMPERATIVE ở _classify_head (bảo thủ có chủ đích — chặn filler mang
# nghĩa ở câu mệnh lệnh/nghi vấn còn hơn để lọt câu sai nghĩa kiểu "tự dưng
# kiếm giúp tôi chỗ Đà Nẵng").
head_statement_markers: [mình, tôi, muốn]
head_imperative_verbs:
  [xin, tìm, cho, chỉ, kiếm, dẫn, đi, tới, hỏi, dò, tra, nhờ, đến, mong,
   ghé, chạy, qua, mở, đưa, rẽ, dừng, vui, bật, hướng, lái, phóng, vọt,
   lục, mò, giúp, về, vào, vòng, tấp, quẹo, lượn, táp, biết, có, làm]

# Fillers CHỈ được nối vào {opener} (đầu câu) — variation.py#apply_variations
# bỏ qua filler nếu template không có slot {opener}, không nối vào {closer}
# nữa (từng gây "…Sea Food kiểu", "…không tự dưng" — filler rơi vào cuối
# câu). "ơi" đã bị bỏ khỏi list từ đợt trước: nó là hô ngữ cần danh xưng
# người nghe đi kèm ("anh ơi"), không đứng một mình tự nhiên ở đầu câu.
#
# `heads`: HeadClass nào được phép dùng filler này (xem templates.HeadClass
# + _classify_head) — "à"/"ờ"/"thế" là thán từ trung tính, dùng được ở mọi
# thức câu. "tự dưng"/"kiểu"/"ấy" là từ MANG NGHĨA (trạng từ "bỗng nhiên",
# chỉ định từ hậu vị, danh từ đệm) — chỉ tự nhiên khi đứng trước một mệnh đề
# TRẦN THUẬT có chủ ngữ, sai nghĩa khi gắn vào câu mệnh lệnh ("tự dưng chỉ
# đường đến..." vô nghĩa) hay câu nghi vấn cụt (fix bug user báo: "tự dưng
# kiếm giúp tôi chỗ thành phố Đà Nẵng nhé").
fillers:
  - {text: "à", heads: [imperative, statement, question]}
  - {text: "ờ", heads: [imperative, statement, question]}
  - {text: "thế", heads: [imperative, statement, question]}
  - {text: "tự dưng", heads: [statement]}
  - {text: "kiểu", heads: [statement]}
  - {text: "ấy", heads: [statement]}

phrasings:
  - "đi thế nào"
  - "đi kiểu gì"
  - "đường nào gần nhất"
  - "đi đường nào"
  - "đi lối nào"
  - "mất bao lâu"

# Danh từ chung điền vào slot {category_noun} — "loại địa điểm người dùng
# đang tìm QUANH {entity}", độc lập với category thật của {entity}
# (docs/generation.md#template-bank). Fix bug "gần đây có Chợ Miếu Bông nào
# không" — lượng từ bất định "nào" chỉ hợp pháp trên danh từ CHUNG, không
# phải tên riêng; {category_noun} cho template một danh từ chung thật để
# "nào" gắn vào, còn {entity} chỉ đóng vai mốc tham chiếu ("gần {entity}").
#
# Key là giá trị schema.Subcategory (không đẻ thêm không gian tên riêng) —
# load_lexicon() validate mọi key parse được sang Subcategory. Chỉ liệt kê
# subcategory nào là loại địa điểm người dùng THỰC SỰ hỏi "có ... gần đây
# không" trong đời sống; landmark/admin_unit/street không có mặt vì không
# ai hỏi "có phường nào gần đây không".
category_nouns:
  market: ["chợ"]
  hospital: ["bệnh viện"]
  gas_station: ["cây xăng", "trạm xăng"]
  bank: ["ngân hàng"]
  supermarket: ["siêu thị"]
  restaurant: ["quán ăn", "quán cà phê"]
  park: ["công viên"]
  hotel: ["khách sạn", "nhà nghỉ"]
  school: ["trường học"]
  university: ["trường đại học"]
  government_office: ["ủy ban", "cơ quan nhà nước"]
  shopping_mall: ["trung tâm thương mại"]
  worship_place: ["chùa", "nhà thờ"]
  stadium: ["sân vận động"]

# Tiền tố hành chính — phase 5/6 dùng khi compose {entity} theo trục
# admin_prefix (docs/generation.md#variation-axes). "" nghĩa là lược bỏ
# tiền tố, cách nói rất phổ biến trong tiếng Việt nói.
admin_prefixes:
  province:
    - "tỉnh"
    - "thành phố"
    - ""
  district:
    - "quận"
    - "huyện"
    - ""
  ward:
    - "phường"
    - "xã"
    - ""
  street:
    - "đường"
    - "phố"
    - ""

# Từ viết hoa được phép xuất hiện GIỮA câu template. Rỗng theo mặc định:
# tiếng Việt không viết hoa danh từ chung giữa câu, nên mọi token viết hoa
# không phải token đầu câu đều bị validator #8 coi là tên riêng hardcode
# (hard rule #6). Chỉ thêm vào đây khi có case thật, kèm lý do.
proper_noun_allowlist: []

