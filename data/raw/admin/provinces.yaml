# 34 đơn vị hành chính cấp tỉnh hiện hành (sau sáp nhập 1/7/2025) + alias.
#
# NGUỒN & ĐỘ TIN CẬY: xem data/raw/admin/SOURCES.md — danh sách sáp nhập
# dưới đây được tái dựng từ tin tức công khai, CHƯA đối chiếu văn bản pháp
# lý gốc (Nghị quyết 202/2025/QH15). Cần rà soát trước khi coi là ground
# truth cho môi trường sản xuất.
#
# Quy ước:
#   province_id      : id ổn định 2 chữ số do dataset này tự gán (KHÔNG phải
#                       mã GSO chính thức) — chỉ cần duy nhất & ổn định qua
#                       các lần build.
#   admin_status      : unchanged | merged  (so với ranh giới trước 1/7/2025)
#   aliases.legacy    : tên tỉnh cũ thuộc "63 tỉnh/thành" giai đoạn 2008–2025.
#                       Mỗi tên xuất hiện đúng 1 lần trong TOÀN BỘ file này —
#                       đây là bất biến hard rule #2, được validate ở
#                       build_master và test_admin_data.py.
#   aliases.spoken    : cách gọi dân gian, KHÔNG tính vào invariant 63 (ví dụ
#                       "Hà Tây" đã sáp nhập vào Hà Nội từ 2008, tức là TRƯỚC
#                       giai đoạn 63 tỉnh 2008–2025, nên không nằm trong tập
#                       63 — nhưng vẫn là spoken form hợp lệ nên giữ ở đây).
#   aliases.abbrev_expanded : dạng đầy đủ đã mở rộng của một viết tắt phổ
#                       biến (giá trị lưu KHÔNG chứa viết tắt — xem hard rule #1).
#
#   Mỗi alias là một mapping {name, admin_prefix}, KHÔNG phải string trần:
#     name         : tên alias.
#     admin_prefix : "tỉnh" | "thành phố" | "" — tiền tố hành chính ĐÚNG của
#                    CHÍNH TÊN ĐÓ tại thời điểm nó còn được dùng, không phải
#                    tiền tố của tỉnh hiện hành. Ví dụ "Đà Nẵng" hợp nhất
#                    "tỉnh Quảng Nam" (is_municipality hiện tại = true) —
#                    nhưng legacy alias "Quảng Nam" mang admin_prefix "tỉnh"
#                    vì bản thân Quảng Nam trước sáp nhập là một tỉnh, không
#                    phải thành phố trực thuộc trung ương. "" nghĩa là tên
#                    đó tự mang nghĩa hành chính rồi (vd "thủ đô", "thành
#                    phố mang tên Bác") hoặc đã chứa sẵn tiền tố trong chuỗi
#                    (vd "thành phố Hồ Chí Minh") — không được gắn thêm tiền
#                    tố khác lên nó (xem aliases.py#resolve_province).
#
#   5 tỉnh/thành từng là "thành phố trực thuộc trung ương" trong hệ 63 tỉnh
#   (2008–2025): Hà Nội, Hồ Chí Minh, Hải Phòng, Đà Nẵng, Cần Thơ — CHỈ 5
#   tên legacy này mang admin_prefix "thành phố"; mọi legacy khác (kể cả
#   "Thừa Thiên Huế", vì Huế chỉ thành thành phố trực thuộc TW SAU sáp nhập
#   2025) mang "tỉnh".

- province_id: "01"
  name_current: "Hà Nội"
  admin_status: unchanged
  region: bac_bo
  is_municipality: true
  popularity_tier: 1
  aliases:
    legacy:
      - {name: "Hà Nội", admin_prefix: "thành phố"}
    spoken:
      - {name: "thủ đô", admin_prefix: ""}
      - {name: "Hà Tây", admin_prefix: "tỉnh"}
    abbrev_expanded: []

