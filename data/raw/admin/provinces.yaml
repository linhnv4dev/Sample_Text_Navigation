  admin_status: merged
  region: trung_bo
  is_municipality: true
  # tier 1: thành phố du lịch lớn thứ ba cả nước (Cầu Rồng, Bà Nà, Hội An,
  # Mỹ Sơn sau sáp nhập Quảng Nam). Mức "nổi bật nhưng chưa ngang Hà
  # Nội/TP.HCM" được diễn đạt bằng province_weights.overrides trong
  # config/distribution.yaml, không phải bằng cách hạ tier xuống 2 — thang
  # tier chỉ có 3 bậc, không đủ để phân biệt mức độ trong cùng một tier.
