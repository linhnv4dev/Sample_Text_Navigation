    legacy:
      - {name: "Hồ Chí Minh", admin_prefix: "thành phố"}
      - {name: "Bình Dương", admin_prefix: "tỉnh"}
      - {name: "Bà Rịa - Vũng Tàu", admin_prefix: "tỉnh"}
    spoken:
      - {name: "Sài Gòn", admin_prefix: "thành phố"}
      - {name: "thành phố mang tên Bác", admin_prefix: ""}
