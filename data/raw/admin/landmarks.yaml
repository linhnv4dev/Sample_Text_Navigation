# Địa danh nổi tiếng curate tay — nguồn MANUAL duy nhất cho POI, bù cho
# thin-slice OSM (chỉ 3/34 tỉnh, xem SOURCES.md). Quy trình: soạn draft
# (LLM offline, hard rule #5) rồi người review đối chiếu từng tên trước khi
# commit — KHÔNG phải nguồn tự động, nên không re-run được như fetch_osm.py.
#
# NGUỒN & ĐỘ TIN CẬY: xem data/raw/admin/SOURCES.md. Đây là kiến thức phổ
# thông (địa danh cấp quốc gia/tỉnh ai cũng biết), CHƯA đối chiếu toạ độ
# hay văn bản xếp hạng di tích chính thức — cần rà soát trước khi coi là
# ground truth cho môi trường sản xuất.
#
# Quy ước:
#   province_id : khớp đúng data/raw/admin/provinces.yaml (tỉnh HIỆN HÀNH,
#                 sau sáp nhập 1/7/2025) — landmark của tỉnh cũ đã sáp nhập
#                 (vd Hội An thuộc Quảng Nam cũ) được gộp vào đúng
#                 province_id mới (04 Đà Nẵng), không tạo province_id riêng.
#   name        : tên đầy đủ, không viết tắt (hard rule #1) — build_master
#                 chỉ normalize_name(), KHÔNG viết hoa/sửa chính tả hộ.
#   subcategory : một giá trị schema.Subcategory hợp lệ cho Category.LANDMARK
#                 (lake/bridge/monument/heritage_site/market/mountain/beach/
#                 museum/tourist_attraction) — build_master.validate() reject
#                 nếu parse sai.
#   fame_tier   : 1 = nổi tiếng cấp quốc gia (ai cũng biết dù chưa tới tỉnh
#                 đó), 2 = nổi tiếng cấp tỉnh/vùng. Map thẳng sang
#                 pois.csv#popularity_tier, khác OSM POI (hardcode "2").

